<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数式検知 & LaTeX 変換ツール (PDF・論文コピペ対応)</title>

  <!-- KaTeX CSS & JS (高速な数式レンダリングライブラリ) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8" crossorigin="anonymous"></script>

  <!-- スタイルシート -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- ヘッダー -->
    <header>
      <div class="header-inner">
        <div class="logo-area">
          <span class="logo-icon">∑</span>
          <div>
            <h1>数式検知 & LaTeX 変換ツール</h1>
            <p class="subtitle">PDF・論文・規格書からコピーした崩れた数式や変数を自動検知し、LaTeXに復元。下付き・上付き・乗算のサジェスト切替対応</p>
          </div>
        </div>
      </div>
    </header>

    <div class="main-grid">
      <!-- 入力カード -->
      <section class="card input-card">
        <div class="card-header">
          <div class="card-title">📝 入力テキスト（PDFや文献からコピーした文章）</div>
          <div class="sample-buttons">
            <span class="sample-label">お試し例文:</span>
            <button id="sampleBtnShip" class="btn-primary btn-sm" type="button">🚢 船舶規則・表コピペ (改行分数)</button>
            <button id="sampleBtnPhysics" class="btn-secondary btn-sm" type="button">🌊 流体・熱力学 (レイノルズ数・気体)</button>
            <button id="sampleBtnML" class="btn-secondary btn-sm" type="button">🤖 機械学習 (損失関数・勾配更新)</button>
            <button id="sampleBtnMech" class="btn-secondary btn-sm" type="button">🏗️ 構造・材料力学 (曲げ応力・断面)</button>
          </div>
        </div>

        <textarea id="inputText" placeholder="PDFや論文、規格書からコピーしたテキストを貼り付けてください...
（改行で縦並びになった分数や、数学イタリック記号、表の記号列なども自動結合・復元します）"></textarea>

        <div class="control-bar">
          <div class="control-left">
            <button id="detectBtn" class="btn-primary" type="button">⚡ 数式を検知・変換</button>
            <button id="clearBtn" class="btn-secondary" type="button">クリア</button>
            <label class="checkbox-label">
              <input type="checkbox" id="autoDetect" checked> 入力時にリアルタイム変換
            </label>
          </div>
        </div>
      </section>

      <!-- 検出結果カード -->
      <section class="card results-card">
        <div class="card-header">
          <div class="card-title">
            <span>🎯 検知された数式・記号一覧</span>
            <span id="resultCount" class="badge badge-count">0 件</span>
          </div>
          <div>
            <button id="copyAllBtn" class="btn-secondary btn-sm" type="button">📑 全LaTeX一括コピー</button>
          </div>
        </div>

        <div id="resultsSection" style="display: none;">
          <div class="table-responsive">
            <table class="results-table">
              <thead>
                <tr>
                  <th style="width: 40px;">No.</th>
                  <th style="width: 150px;">分類</th>
                  <th style="width: 200px;">検知された原文</th>
                  <th>解釈サジェスト & LaTeX コード</th>
                  <th>LaTeX プレビュー</th>
                  <th style="width: 160px;">操作</th>
                </tr>
              </thead>
              <tbody id="resultsTableBody">
                <!-- JavaScript で動的生成 -->
              </tbody>
            </table>
          </div>
        </div>

        <div id="emptyState" class="empty-state">
          <div class="empty-icon">🔍</div>
          <p>入力テキストから数式または記号が検出されていません。</p>
          <p style="font-size: 0.85rem; margin-top: 4px;">上のお試し例文ボタンを押すか、テキストを貼り付けてみてください。</p>
        </div>
      </section>
    </div>
  </div>

  <!-- コピー通知トースト -->
  <div id="copyToast" class="toast">クリップボードにコピーしました</div>

  <!-- スクリプト読み込み -->
  <script src="math_dict.js"></script>
  <script src="app.js"></script>
</body>
</html>
